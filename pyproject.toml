[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermeslens"
version = "0.1.0"
description = "Agent framework dissection lab — architecture scorecards, tradeoff analysis, and steal-these-ideas patches"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "HermesLens Contributors" }]
keywords = [
  "agent-framework",
  "hermes",
  "openclaw",
  "langchain",
  "autogen",
  "crewai",
  "architecture",
  "scorecard",
  "agentic-ai",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "mcp>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "httpx",
]

[project.urls]
Homepage = "https://amiirhosseini.com/HermesLens/"
Documentation = "https://github.com/Amiirhosseini/hermeslens#readme"
Repository = "https://github.com/Amiirhosseini/hermeslens"
Issues = "https://github.com/Amiirhosseini/hermeslens/issues"

[project.scripts]
hermeslens = "hermeslens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hermeslens"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]  # Typer Argument/Option defaults are intentional
